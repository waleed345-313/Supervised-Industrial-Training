<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bannerTitle">
  <title id="bannerTitle">Supervised Industrial Training internship management banner</title>
  <style>
    .float1 {
      animation: floatA 6s ease-in-out infinite;
    }

    .float2 {
      animation: floatB 7s ease-in-out infinite;
    }

    .pulse {
      animation: pulseText 3.2s ease-in-out infinite;
    }

    @keyframes floatA {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(18px);
      }
    }

    @keyframes floatB {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-23px);
      }
    }

    @keyframes pulseText {
      0%, 100% {
        opacity: 0.75;
      }
      50% {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .float1,
      .float2,
      .pulse {
        animation: none !important;
      }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5E9" />
      <stop offset="1" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)" />

  <circle class="float1" cx="180" cy="70" r="18" fill="white" fill-opacity="0.16" />
  <circle class="float2" cx="1080" cy="255" r="24" fill="white" fill-opacity="0.14" />

  <text x="600" y="128" text-anchor="middle" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="white" filter="url(#softGlow)">
    Supervised Industrial Training
  </text>

  <text x="600" y="180" text-anchor="middle" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="white" fill-opacity="0.95">
    Internship Management Platform
  </text>

  <text class="pulse" x="600" y="226" text-anchor="middle" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="white" fill-opacity="0.9">
    Students • Universities • Companies
  </text>
</svg>
