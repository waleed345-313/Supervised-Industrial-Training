<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Supervised Industrial Training Platform banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5E9">
        <animate attributeName="stop-color" values="#0EA5E9;#2563EB;#0EA5E9" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="1" stop-color="#14B8A6">
        <animate attributeName="stop-color" values="#14B8A6;#0F766E;#14B8A6" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)" />

  <circle cx="180" cy="70" r="18" fill="white" fill-opacity="0.16">
    <animate attributeName="cy" values="70;88;70" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1080" cy="255" r="24" fill="white" fill-opacity="0.14">
    <animate attributeName="cy" values="255;232;255" dur="7s" repeatCount="indefinite" />
  </circle>

  <text x="600" y="128" text-anchor="middle" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="white" filter="url(#softGlow)">
    Supervised Industrial Training
  </text>

  <text x="600" y="180" text-anchor="middle" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="white" fill-opacity="0.95">
    Internship Management Platform
  </text>

  <text x="600" y="226" text-anchor="middle" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="white" fill-opacity="0.9">
    Students • Universities • Companies
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3.2s" repeatCount="indefinite" />
  </text>
</svg>
